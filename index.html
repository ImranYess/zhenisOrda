<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<!-- PAGE TITLE — change as needed -->
<title>Жүйелі Даму Платформасы</title>

<!-- Manrope: modern, masculine, excellent Cyrillic/Kazakh support -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css"/>

<style>
  .ambient{
    position:fixed;top:-120px;left:50%;
    transform:translateX(-50%);
    width:520px;height:320px;
    background:radial-gradient(ellipse,rgba(201,168,76,0.08) 0%,transparent 70%);
    pointer-events:none;z-index:0;
  }
  .site-header,.hero-section,.site-footer{position:relative;z-index:1}
  .trust-row{
    display:flex;align-items:center;justify-content:center;
    gap:6px;margin-top:20px;
    font-size:0.7rem;color:var(--cream-3);letter-spacing:0.05em;
  }
  .trust-dot{
    width:3px;height:3px;background:var(--gold);
    border-radius:50%;opacity:0.6;
  }
  .btn-arrow{display:inline-block;font-size:1rem;transition:transform 0.2s ease}
  .btn-primary:hover .btn-arrow{transform:translateX(4px)}
</style>
</head>
<body>

<div class="ambient"></div>

<!-- HEADER -->
<header class="site-header">
  <!-- LOGO — change text as needed -->
  <span class="logo">Жүйелі Даму</span>
</header>

<!-- HERO -->
<section class="hero-section">
  <div class="wrap">

    <!--
      SPEAKER IMAGE HERE
      Replace the div.speaker-placeholder below with:
        <a href="https://pngicon.ru/belaja-rubashka.html">
      PNG must have transparent background.
      Recommended size: 600–800px wide @ 2x.
    -->
    <div class="hero-img-wrap reveal d1">
      <img src="https://pngicon.ru/file/uploads/Belaja-rubashka-transparent-background-105x128.png" alt="Белая рубашка">
    </div>

    <!-- MAIN HEADLINE — change text here -->
    <h1 class="hero-title reveal d2">
      Қош келдіңіз!<br/>
      Сіз жай курсқа емес,<br/>
      <span>жүйелі даму<br/>ортасына</span> кірдіңіз.
    </h1>

    <!-- SUBHEADLINE — change text here -->
    <p class="hero-sub reveal d3">
      Ойлау, қаржы, бизнес және лидерлік бойынша<br/>
      саты-саты дамуға арналған платформа.
    </p>

    <!-- CTA BUTTON — goes to video.html -->
    <div class="hero-cta-wrap reveal d4">
      <button class="btn-primary" onclick="goToVideo()">
        Жүйеге кіру <span class="btn-arrow">→</span>
      </button>

  </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
  <!-- FOOTER TEXT — change as needed -->
  <p>© 2025 Жүйелі Даму &nbsp;·&nbsp; Барлық құқықтар қорғалған</p>
</footer>

<script>
  function goToVideo() {
    window.location.href = 'video.html';
  }
  const els = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  els.forEach(el => obs.observe(el));
</script>
</body>
</html>
